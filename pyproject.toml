[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yosman"
version = "1.0.0"
description = "Yosman — a local API development and testing studio"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "httpx>=0.27.0",
    "pydantic>=2.9.0",
    "pywebview>=5.0",
]

[project.scripts]
yosman = "yosman.__main__:main"

[tool.setuptools.packages.find]
include = ["yosman*"]
